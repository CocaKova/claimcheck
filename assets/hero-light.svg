<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="claimcheck: the hook records each tool call into a redacted, hash-chained run log; at the end of the turn the verifier checks every claim in the agent's final message against that log and writes a signed receipt"><rect width="1200" height="320" rx="16" fill="#ffffff" stroke="#d0d7de"/><text x="60" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="38" font-weight="700" fill="#1f2328">claimcheck</text><text x="60" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">Receipts for AI agent runs: what it touched, what it claimed, whether the two match.</text><rect x="60" y="150" width="232" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="176.0" y="180" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">agent turn</text><text x="176.0" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">tool calls, then a final message</text><rect x="344" y="150" width="232" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="460.0" y="180" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">hook</text><text x="460.0" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">redact, hash-chain each event</text><line x1="292" y1="185" x2="337" y2="185" stroke="#656d76" stroke-width="1.8"/><path d="M336,180 L344,185 L336,190 Z" fill="#656d76"/><rect x="628" y="150" width="232" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="744.0" y="180" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">verifier</text><text x="744.0" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">claims vs. the run log, in code</text><line x1="576" y1="185" x2="621" y2="185" stroke="#656d76" stroke-width="1.8"/><path d="M620,180 L628,185 L620,190 Z" fill="#656d76"/><rect x="912" y="150" width="232" height="70" rx="10" fill="#f6f8fa" stroke="#23406e" stroke-width="1.5"/><text x="1028.0" y="180" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#1f2328">signed receipt</text><text x="1028.0" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#656d76">ed25519, id = content hash</text><line x1="860" y1="185" x2="905" y2="185" stroke="#656d76" stroke-width="1.8"/><path d="M904,180 L912,185 L904,190 Z" fill="#656d76"/><text x="60" y="280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#656d76">each claim is marked</text><rect x="212" y="262" width="83" height="26" rx="13" fill="none" stroke="#1f7a4d" stroke-width="1.4"/><text x="253.6" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#1f7a4d">verified</text><rect x="307.2" y="262" width="100" height="26" rx="13" fill="none" stroke="#a16207" stroke-width="1.4"/><text x="357.2" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#a16207">unverified</text><rect x="419.2" y="262" width="117" height="26" rx="13" fill="none" stroke="#c2561b" stroke-width="1.4"/><text x="477.6" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#c2561b">pre-existing</text><rect x="548.0" y="262" width="117" height="26" rx="13" fill="none" stroke="#b42318" stroke-width="1.4"/><text x="606.4" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#b42318">contradicted</text><rect x="676.8" y="262" width="92" height="26" rx="13" fill="none" stroke="#656d76" stroke-width="1.4"/><text x="722.6" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#656d76">unchecked</text><text x="786.4" y="280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#656d76">by code, never by a model</text></svg>