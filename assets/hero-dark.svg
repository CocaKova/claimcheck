<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="claimcheck: the hook records each tool call into a redacted, hash-chained run log; at the end of the turn the verifier checks every claim in the agent's final message against that log and writes a signed receipt"><rect width="1200" height="320" rx="16" fill="#0d1117" stroke="#30363d"/><text x="60" y="78" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="38" font-weight="700" fill="#e6edf3">claimcheck</text><text x="60" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Receipts for AI agent runs: what it touched, what it claimed, whether the two match.</text><rect x="60" y="150" width="232" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="176.0" y="180" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">agent turn</text><text x="176.0" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">tool calls, then a final message</text><rect x="344" y="150" width="232" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="460.0" y="180" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">hook</text><text x="460.0" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">redact, hash-chain each event</text><line x1="292" y1="185" x2="337" y2="185" stroke="#8b949e" stroke-width="1.8"/><path d="M336,180 L344,185 L336,190 Z" fill="#8b949e"/><rect x="628" y="150" width="232" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="744.0" y="180" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">verifier</text><text x="744.0" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">claims vs. the run log, in code</text><line x1="576" y1="185" x2="621" y2="185" stroke="#8b949e" stroke-width="1.8"/><path d="M620,180 L628,185 L620,190 Z" fill="#8b949e"/><rect x="912" y="150" width="232" height="70" rx="10" fill="#161b22" stroke="#9db6dd" stroke-width="1.5"/><text x="1028.0" y="180" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf3">signed receipt</text><text x="1028.0" y="202" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e">ed25519, id = content hash</text><line x1="860" y1="185" x2="905" y2="185" stroke="#8b949e" stroke-width="1.8"/><path d="M904,180 L912,185 L904,190 Z" fill="#8b949e"/><text x="60" y="280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">each claim is marked</text><rect x="212" y="262" width="83" height="26" rx="13" fill="none" stroke="#5cc48e" stroke-width="1.4"/><text x="253.6" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#5cc48e">verified</text><rect x="307.2" y="262" width="100" height="26" rx="13" fill="none" stroke="#e2b04a" stroke-width="1.4"/><text x="357.2" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#e2b04a">unverified</text><rect x="419.2" y="262" width="117" height="26" rx="13" fill="none" stroke="#f08a5a" stroke-width="1.4"/><text x="477.6" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#f08a5a">pre-existing</text><rect x="548.0" y="262" width="117" height="26" rx="13" fill="none" stroke="#f27b70" stroke-width="1.4"/><text x="606.4" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#f27b70">contradicted</text><rect x="676.8" y="262" width="92" height="26" rx="13" fill="none" stroke="#8b949e" stroke-width="1.4"/><text x="722.6" y="279.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5" font-weight="600" fill="#8b949e">unchecked</text><text x="786.4" y="280" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">by code, never by a model</text></svg>